[package]
name = "dreamd"
version = "0.3.0"
description = "Lightweight GUI markdown reader with a highlight/annotation -> agent loop"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
# Only the explicitly declared [[bench]] targets below are built, so
# benches/common.rs stays a plain shared module rather than a bench of its own.
autobenches = false

[lib]
# Exists so `benches/` and unit tests can import the internals. The binary is a
# thin shell over this.
name = "dreamd"
path = "src/lib.rs"

[[bin]]
name = "dreamd"
path = "src/main.rs"

[features]
default = []
# Opt-in timing instrumentation (see `src/perf.rs`). Off by default so shipping
# builds carry none of it. Enable with `cargo build --features perf`.
perf = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `features = []` does NOT disable defaults, which are
# ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "dbus"].
# `compression` is what brotli-compresses the embedded `ui/`. `x11`/`dbus` are
# kept because the crates behind them are cfg(linux)-gated — zero bytes on
# macOS, and they keep a Linux build a one-line change. Dropped:
# `common-controls-v6` (Windows), and `dynamic-acl`, which embeds
# gen/schemas/acl-manifests.json to support `Manager::add_capability` — an API
# dreamd never calls. Without it `runtime_authority!` discards the manifest at
# macro expansion; the static `capabilities/default.json` goes through a
# separate always-emitted path and is unaffected.
tauri = { version = "2", default-features = false, features = [
  "wry",
  "compression",
  "x11",
  "dbus",
  # The `asset://` custom protocol, which is how a `![](diagram.png)` in the
  # document reaches the webview at all: the CSP admits no `file:` (nor should
  # it — that origin can read the whole disk), so an image outside the bundle
  # has to arrive through a protocol handler with a scope. `main.rs` opens that
  # scope on the repo root and nowhere else.
  "protocol-asset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# `default-fancy` minus `plist-load` and `yaml-load` — the loaders for syntax and
# theme definitions in their *source* form, which dreamd never reads: it only
# ever loads the baked dumps (`SyntaxSet::load_defaults_newlines`,
# `ThemeSet::load_defaults`). Dropping them drops `plist` and `yaml-rust`.
# `dump-create` looks equally unused but cannot go: `html` -> `parsing` ->
# `dump-create`.
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "html",
  "regex-fancy",
] }
ignore = "0.4"
notify = "6"
nucleo = "0.5"
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
# Default features include `image-data`, which pulls the whole `image` codec
# stack (and `moxcms`) for clipboard images. dreamd copies text and nothing else.
arboard = { version = "3", default-features = false }
open = "5"
trash = "5"
portable-pty = "0.9.0"
# The File -> Open picker, driven straight from the native menu handler. The
# Tauri dialog plugin wraps this same crate; going direct avoids a plugin
# registration and an ACL entry to reach the same NSOpenPanel (GtkFileChooser on
# Linux). Not target-gated: the picker exists on both platforms, and gating it
# was what kept `adopt_root` — the config reload, re-walk, watcher re-arm and
# marks swap — from ever being compiled off macOS.
rfd = "0.17"
# One function: poll(2) in the two socket accept loops (`mcp::server`,
# `agent::gate_server`), so a connect wakes accept immediately instead of
# waiting out the remainder of a 200ms cancel-check nap. Already in the tree
# transitively; this only makes it addressable.
libc = "0.2"

# `arboard`'s defaults are off for `image-data`; Wayland's clipboard protocol is
# a separate feature and dreamd needs it back, or the clipboard fallback in
# `send.rs` fails on any Wayland session — which is the Arch default.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = [
  "wayland-data-control",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "locate"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "walk"
harness = false
