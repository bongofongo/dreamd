[package]
name = "dreamd"
version = "0.1.0"
description = "Lightweight GUI markdown reader with a highlight/annotation -> agent loop"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "dreamd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4"
notify = "6"
nucleo = "0.5"
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
arboard = "3"
open = "5"
trash = "5"
