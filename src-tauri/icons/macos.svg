<!-- The macOS app icon, and ONLY the macOS app icon (`icon.icns`).

     Same artwork as `website/public/favicon.svg` — the shapes below are copied
     from it verbatim — but laid out to Apple's grid rather than filling the
     square. A macOS app icon is an 824x824 rounded rect centred in a 1024x1024
     canvas: 100px of transparent margin on every side, corner radius 185.4.
     A favicon fills its square, because a browser tab has no such convention;
     rendering that shape in the Dock makes dreamd noticeably bigger than every
     app beside it, which reads as a mistake rather than as a choice.

     The transform is `translate(100) scale(25.75)` — 824/32 — so the shapes
     keep the favicon's own 32-unit coordinates and the two files stay
     obviously the same drawing. The one deliberate difference is the outer
     rect's `rx`: 7.2 here rather than 7, which is Apple's 185.4 at this scale.

     Regenerate `icon.icns` from this, never from the favicon — see README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(100,100) scale(25.75)">
    <rect width="32" height="32" rx="7.2" fill="#171b22"/>
    <rect x="7" y="9" width="18" height="4" rx="1.5" fill="#f6d365"/>
    <rect x="7" y="17" width="18" height="2" rx="1" fill="#2c3542"/>
    <rect x="7" y="22" width="11" height="2" rx="1" fill="#6ea8fe"/>
  </g>
</svg>
