# dreamd release pipeline.
#
# This file is deliberately thin: every step that does real work shells out to
# `packaging/build.sh`, which runs identically on a laptop. A release can be
# reproduced and debugged locally without pushing a tag.
#
#   git tag v0.2.0 && git push --tags   ->  builds both arches, creates a DRAFT
#   (verify the app on a clean machine) ->  publish the release by hand
#   publishing                          ->  bumps the Homebrew cask
#
# The draft step is the point: a release is public the instant it exists and
# Homebrew users pull it within minutes, so nothing reaches them until a human
# has double-clicked the thing.
name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: # rehearse the matrix without cutting a tag

permissions:
  contents: write

# Releases are signed and notarized. packaging/SIGNING.md is the runbook.
#
# There is no `env: NO_SIGN` key here, and that absence is the switch. Setting it
# makes check-signing.sh stand down and build.sh pass --no-sign — right for a
# local build, wrong for anything published: `brew install --cask` and a browser
# download both write com.apple.quarantine, and an unsigned app that arrives
# quarantined opens as "dreamd is damaged". (curl never writes the flag, which is
# why the curl channel worked throughout the unsigned period.) So don't
# reintroduce NO_SIGN to get past a red build — run packaging/check-signing.sh
# against the secrets instead; it names the wrong one in ten seconds.
jobs:
  # ~15 seconds, and it gates a ~20-minute matrix. CI asserts the version rather
  # than rewriting it: a tag should describe a commit, not change it.
  verify:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the tree
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/check-version.sh "${TAG#v}"

      # The bundler's own diagnosis of a bad certificate secret is
      # "SecKeychainItemImport: One or more parameters passed to a function were
      # not valid" — raised after a full Rust build, on both runners at once, and
      # naming none of the six secrets. Ten seconds here instead of forty
      # minutes of runner time there.
      - name: Signing secrets must be usable
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/check-signing.sh

  build:
    if: github.event_name != 'release'
    needs: verify
    strategy:
      # One arch failing must not bin the other's artifacts.
      fail-fast: false
      matrix:
        include:
          # Native runners per arch rather than cross-compiling: it sidesteps
          # cross-linking under codesign entirely, and all three are free on a
          # public repo. Adding Linux was one more entry here plus one `case` arm
          # in packaging/build.sh, exactly as this comment predicted —
          # everything platform-specific is derived from the triple, never
          # encoded in this matrix.
          - { target: aarch64-apple-darwin, runner: macos-14 }
          # macos-13 was retired 2025-12-04. A retired label does not error —
          # the job queues for a runner that will never exist and burns the 24h
          # workflow cap, which is exactly what the v0.1.0 attempt did. Its
          # successor is the last Intel image Actions will offer; it goes away
          # in autumn 2027, at which point this row is deleted, not relabelled.
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          # ubuntu-22.04 rather than -24.04 on purpose: the produced ELF links
          # the runner's glibc, and 2.35 runs on everything newer while a 2.39
          # build would refuse to start on anything older. There is no aarch64
          # Linux row — no free native runner, and cross-linking webkit2gtk is a
          # different problem from cross-linking nothing.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    # A cold build is ~8 minutes. This exists so that the *next* dead runner
    # label fails in half an hour instead of pinning the run for a day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Kept identical to ci.yml's list. It is duplicated rather than factored
      # into a composite action because two files of five lines each is cheaper
      # to read than a third file, and apt is the one thing here that genuinely
      # cannot come from the triple.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # The cargo workspace root is the repo root, not src-tauri/.
          workspaces: ". -> target"

      # Pinned. An unpinned tauri-cli means a bundler change can break a release
      # with no commit in this repo. Bump it deliberately.
      #
      # Not separately cached, and measurably doesn't need to be:
      # Swatinem/rust-cache already carries `~/.cargo/bin`, so `cargo install`
      # finds the pinned version present and exits in ~1s. The 6-11 minutes this
      # step cost on 2026-07-26 was a *cold rust-cache*, not a per-run cost —
      # an `actions/cache` on ~/.cargo/bin/cargo-tauri was added on 2026-07-27,
      # measured to change nothing, and removed again.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked

      # The Tauri bundler imports APPLE_CERTIFICATE into a keychain itself, then
      # signs, notarizes and staples — one fewer moving part than a hand-rolled
      # `security create-keychain` sequence, and it is the path upstream tests.
      # packaging/build.sh then asserts the result with spctl and stapler, because
      # notarization silently no-ops if one of these names is misspelled and the
      # failure would otherwise surface on a user's machine as "dreamd is damaged".
      - name: Build, sign, notarize, package
        run: packaging/build.sh ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # Gated on the PUBLISH_CASK repo variable, which is now true — an unsigned
  # artifact reaching users through the cask opens as "dreamd is damaged", so
  # this stays off whenever signing is off:
  #
  #   gh variable set PUBLISH_CASK --body false    # disarm, if signing goes off
  #
  # Runs on publish, not on the draft, so the cask can only ever point at a
  # release a human has looked at.
  #
  # `brew bump-cask-pr` is the wrong tool for a personal tap: it wants a full
  # Homebrew checkout and a fork, and opens a PR to yourself that will stop being
  # reviewed by the third release. Commit directly.
  tap:
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease
      && vars.PUBLISH_CASK == 'true'
    # macOS, not ubuntu: `brew audit --cask` is a macOS-only command, and this
    # job spends most of its time waiting on a download either way.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dreamd

      - uses: actions/checkout@v4
        with:
          repository: bongofongo/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the cask
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env rather than inline ${{ }} so the value is never spliced into
          # the shell as source text.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          # Read the checksums the build already computed rather than
          # re-downloading and re-hashing 5 MB: these files are the artifacts of
          # record, so the cask's shas are provably the bytes that were signed.
          for a in aarch64-apple-darwin x86_64-apple-darwin; do
            gh release download "$TAG" -R bongofongo/dreamd \
              -p "dreamd-$V-$a.zip.sha256" -O "$a.sha256"
          done
          SHA_ARM="$(tr -d '[:space:]' < aarch64-apple-darwin.sha256)"
          SHA_INTEL="$(tr -d '[:space:]' < x86_64-apple-darwin.sha256)"
          mkdir -p tap/Casks
          sed -e "s|@@VERSION@@|$V|" \
              -e "s|@@SHA_ARM@@|$SHA_ARM|" \
              -e "s|@@SHA_INTEL@@|$SHA_INTEL|" \
              dreamd/packaging/cask.rb.tmpl > tap/Casks/dreamd.rb
          # Token-shaped, not a bare '@@': the template's own header comment says
          # "the three @@ tokens below", sed never touches a comment, and a bare
          # match therefore fired on every run. This guard failed 100% of the
          # time from the day it was written until v0.1.0 was published.
          grep -n '@@[A-Z_]\+@@' tap/Casks/dreamd.rb && { echo "unsubstituted token left in cask" >&2; exit 1; }
          cat tap/Casks/dreamd.rb

      - name: Audit
        run: |
          set -euo pipefail
          # `brew audit <path>` is disabled from Homebrew 6 ("Use brew audit
          # [name ...] instead"), and auditing by name means the cask has to be
          # reachable as a tap rather than as a loose file. Symlink the checkout
          # into place; brew style --fix then edits the real file, which is what
          # gets committed below.
          TAPDIR="$(brew --repository)/Library/Taps/bongofongo/homebrew-tap"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s "$PWD/tap" "$TAPDIR"
          brew style --fix "$TAPDIR/Casks/dreamd.rb"
          # --online is the one that catches a dead download URL, which is the
          # failure mode that actually reaches users.
          brew audit --cask --online bongofongo/tap/dreamd

      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dreamd.rb
          git diff --staged --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "dreamd ${TAG#v}"
          # -u origin HEAD, not a bare `git push`: the tap starts life as an
          # empty repository, so the first bump commits onto an unborn branch
          # with no upstream and a bare push aborts with "no upstream branch"
          # — after notarizing, publishing, and rendering the cask.
          git push -u origin HEAD

  # The Arch counterpart to `tap`, and deliberately one step short of it: it
  # renders the PKGBUILD and uploads it, but does not push. Pushing needs an AUR
  # account and an SSH deploy key in secrets, which is its own decision — until
  # then the artifact is something to `makepkg -si` by hand or drop into the AUR
  # manually, and the rendering is already proven correct by having run.
  #
  # Gated on PUBLISH_AUR, mirroring PUBLISH_CASK:
  #
  #   gh variable set PUBLISH_AUR --body true
  #
  # There is no signing to disarm here — pacman verifies the sha256 in the
  # PKGBUILD, which is the same checksum file the build wrote.
  aur:
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease
      && vars.PUBLISH_AUR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env rather than inline ${{ }} so the value is never spliced into
          # the shell as source text.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          A=x86_64-unknown-linux-gnu
          # The checksum the build already computed, not a re-hash: the .tar.gz
          # is the bundler's staged FHS tree and this file is the record of it.
          gh release download "$TAG" -R bongofongo/dreamd \
            -p "dreamd-$V-$A.tar.gz.sha256" -O linux.sha256
          SHA_LINUX="$(tr -d '[:space:]' < linux.sha256)"
          sed -e "s|@@VERSION@@|$V|" \
              -e "s|@@SHA_LINUX@@|$SHA_LINUX|" \
              packaging/PKGBUILD.tmpl > PKGBUILD
          # Token-shaped from the start, not a bare '@@': the template's own
          # header comment says "the two tokens below", sed never touches a
          # comment, and a bare match would fire on every single run — which is
          # exactly what the cask guard above did until v0.1.0.
          grep -n '@@[A-Z_]\+@@' PKGBUILD && { echo "unsubstituted token left in PKGBUILD" >&2; exit 1; }
          # A PKGBUILD is a bash script; a syntax error here is a package nobody
          # can build, and it costs nothing to catch before upload.
          bash -n PKGBUILD
          cat PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: PKGBUILD
          path: PKGBUILD
          if-no-files-found: error
