# dreamd release pipeline.
#
# This file is deliberately thin: every step that does real work shells out to
# `packaging/build.sh`, which runs identically on a laptop. A release can be
# reproduced and debugged locally without pushing a tag.
#
#   git tag v0.2.0 && git push --tags   ->  builds all three targets, DRAFT release
#   (verify the app on a clean machine) ->  publish the release by hand
#   publishing                          ->  bumps the Homebrew cask, renders the PKGBUILD
#
# The draft step is the point: a release is public the instant it exists and
# Homebrew users pull it within minutes, so nothing reaches them until a human
# has double-clicked the thing.
name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: # rehearse the matrix without cutting a tag

permissions:
  contents: write

# Releases are signed and notarized. packaging/SIGNING.md is the runbook.
#
# There is no `env: NO_SIGN` key here, and that absence is the switch. Setting it
# makes check-signing.sh stand down and build.sh pass --no-sign — right for a
# local build, wrong for anything published: `brew install --cask` and a browser
# download both write com.apple.quarantine, and an unsigned app that arrives
# quarantined opens as "dreamd is damaged". (curl never writes the flag, which is
# why the curl channel worked throughout the unsigned period.) So don't
# reintroduce NO_SIGN to get past a red build — run packaging/check-signing.sh
# against the secrets instead; it names the wrong one in ten seconds.
jobs:
  # ~15 seconds, and it gates a ~20-minute matrix. CI asserts the version rather
  # than rewriting it: a tag should describe a commit, not change it.
  verify:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the tree
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/check-version.sh "${TAG#v}"

      # The bundler's own diagnosis of a bad certificate secret is
      # "SecKeychainItemImport: One or more parameters passed to a function were
      # not valid" — raised after a full Rust build, on both runners at once, and
      # naming none of the six secrets. Ten seconds here instead of forty
      # minutes of runner time there.
      - name: Signing secrets must be usable
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/check-signing.sh

  build:
    if: github.event_name != 'release'
    needs: verify
    strategy:
      # One arch failing must not bin the other's artifacts.
      fail-fast: false
      matrix:
        include:
          # Native runners per arch rather than cross-compiling: it sidesteps
          # cross-linking under codesign entirely, and all three are free on a
          # public repo. Adding Linux was one more entry here plus one `case` arm
          # in packaging/build.sh, exactly as this comment predicted —
          # everything platform-specific is derived from the triple, never
          # encoded in this matrix.
          - { target: aarch64-apple-darwin, runner: macos-14 }
          # macos-13 was retired 2025-12-04. A retired label does not error —
          # the job queues for a runner that will never exist and burns the 24h
          # workflow cap, which is exactly what the v0.1.0 attempt did. Its
          # successor is the last Intel image Actions will offer; it goes away
          # in autumn 2027, at which point this row is deleted, not relabelled.
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          # ubuntu-22.04 rather than -24.04 on purpose: the produced ELF links
          # the runner's glibc, and 2.35 runs on everything newer while a 2.39
          # build would refuse to start on anything older. There is no aarch64
          # Linux row — no free native runner, and cross-linking webkit2gtk is a
          # different problem from cross-linking nothing.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    # A cold build is ~8 minutes. This exists so that the *next* dead runner
    # label fails in half an hour instead of pinning the run for a day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Kept identical to ci.yml's list. It is duplicated rather than factored
      # into a composite action because two files of five lines each is cheaper
      # to read than a third file, and apt is the one thing here that genuinely
      # cannot come from the triple.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # The cargo workspace root is the repo root, not src-tauri/.
          workspaces: ". -> target"

      # Pinned. An unpinned tauri-cli means a bundler change can break a release
      # with no commit in this repo. Bump it deliberately.
      #
      # Not separately cached, and measurably doesn't need to be:
      # Swatinem/rust-cache already carries `~/.cargo/bin`, so `cargo install`
      # finds the pinned version present and exits in ~1s. The 6-11 minutes this
      # step cost on 2026-07-26 was a *cold rust-cache*, not a per-run cost —
      # an `actions/cache` on ~/.cargo/bin/cargo-tauri was added on 2026-07-27,
      # measured to change nothing, and removed again.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked

      # The Tauri bundler imports APPLE_CERTIFICATE into a keychain itself, then
      # signs, notarizes and staples — one fewer moving part than a hand-rolled
      # `security create-keychain` sequence, and it is the path upstream tests.
      # packaging/build.sh then asserts the result with spctl and stapler, because
      # notarization silently no-ops if one of these names is misspelled and the
      # failure would otherwise surface on a user's machine as "dreamd is damaged".
      - name: Build, sign, notarize, package
        run: packaging/build.sh ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # Gated on the PUBLISH_CASK repo variable, which is now true — an unsigned
  # artifact reaching users through the cask opens as "dreamd is damaged", so
  # this stays off whenever signing is off:
  #
  #   gh variable set PUBLISH_CASK --body false    # disarm, if signing goes off
  #
  # Runs on publish, not on the draft, so the cask can only ever point at a
  # release a human has looked at.
  #
  # `brew bump-cask-pr` is the wrong tool for a personal tap: it wants a full
  # Homebrew checkout and a fork, and opens a PR to yourself that will stop being
  # reviewed by the third release. Commit directly.
  tap:
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease
      && vars.PUBLISH_CASK == 'true'
    # macOS, not ubuntu: `brew audit --cask` is a macOS-only command, and this
    # job spends most of its time waiting on a download either way.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dreamd

      - uses: actions/checkout@v4
        with:
          repository: bongofongo/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the cask
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env rather than inline ${{ }} so the value is never spliced into
          # the shell as source text.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          # Read the checksums the build already computed rather than
          # re-downloading and re-hashing 5 MB: these files are the artifacts of
          # record, so the cask's shas are provably the bytes that were signed.
          for a in aarch64-apple-darwin x86_64-apple-darwin; do
            gh release download "$TAG" -R bongofongo/dreamd \
              -p "dreamd-$V-$a.zip.sha256" -O "$a.sha256"
          done
          SHA_ARM="$(tr -d '[:space:]' < aarch64-apple-darwin.sha256)"
          SHA_INTEL="$(tr -d '[:space:]' < x86_64-apple-darwin.sha256)"
          mkdir -p tap/Casks
          sed -e "s|@@VERSION@@|$V|" \
              -e "s|@@SHA_ARM@@|$SHA_ARM|" \
              -e "s|@@SHA_INTEL@@|$SHA_INTEL|" \
              dreamd/packaging/cask.rb.tmpl > tap/Casks/dreamd.rb
          # Token-shaped, not a bare '@@': the template's own header comment says
          # "the three @@ tokens below", sed never touches a comment, and a bare
          # match therefore fired on every run. This guard failed 100% of the
          # time from the day it was written until v0.1.0 was published.
          grep -n '@@[A-Z_]\+@@' tap/Casks/dreamd.rb && { echo "unsubstituted token left in cask" >&2; exit 1; }
          cat tap/Casks/dreamd.rb

      - name: Audit
        env:
          # `--online` walks the GitHub API (release assets, the livecheck
          # strategy), and Homebrew makes those calls *unauthenticated* unless
          # this is set — 60/hour shared across every job on the runner's egress
          # IP, which v0.2.3 exhausted before it made a single call of its own:
          #
          #   exception while auditing dreamd: GitHub API Error: API rate limit
          #   exceeded for 13.105.117.187.
          #
          # It is the job's own GITHUB_TOKEN, so the limit becomes 1000/hour per
          # repository and stops depending on who else shares the runner. Note
          # `gh` was already authenticated in the step above and was never the
          # problem: HOMEBREW_GITHUB_API_TOKEN is the only name brew reads.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `brew audit <path>` is disabled from Homebrew 6 ("Use brew audit
          # [name ...] instead"), and auditing by name means the cask has to be
          # reachable as a tap rather than as a loose file. Symlink the checkout
          # into place; brew style --fix then edits the real file, which is what
          # gets committed below.
          TAPDIR="$(brew --repository)/Library/Taps/bongofongo/homebrew-tap"
          mkdir -p "$(dirname "$TAPDIR")"
          ln -s "$PWD/tap" "$TAPDIR"
          brew style --fix "$TAPDIR/Casks/dreamd.rb"
          # --online is the one that catches a dead download URL, which is the
          # failure mode that actually reaches users.
          brew audit --cask --online bongofongo/tap/dreamd

      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dreamd.rb
          git diff --staged --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "dreamd ${TAG#v}"
          # -u origin HEAD, not a bare `git push`: the tap starts life as an
          # empty repository, so the first bump commits onto an unborn branch
          # with no upstream and a bare push aborts with "no upstream branch"
          # — after notarizing, publishing, and rendering the cask.
          git push -u origin HEAD

  # The Arch counterpart to `tap`, and deliberately one step short of it: it
  # renders the PKGBUILD and uploads it, but does not push. Pushing needs an AUR
  # account and an SSH deploy key in secrets, which is its own decision — until
  # then the artifact is something to `makepkg -si` by hand or drop into the AUR
  # manually, and the rendering is already proven correct by having run.
  #
  # Gated on PUBLISH_AUR, mirroring PUBLISH_CASK:
  #
  #   gh variable set PUBLISH_AUR --body true
  #
  # There is no signing to disarm here — pacman verifies the sha256 in the
  # PKGBUILD, which is the same checksum file the build wrote.
  aur:
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease
      && vars.PUBLISH_AUR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env rather than inline ${{ }} so the value is never spliced into
          # the shell as source text.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          A=x86_64-unknown-linux-gnu
          # The checksum the build already computed, not a re-hash: the .tar.gz
          # is the bundler's staged FHS tree and this file is the record of it.
          gh release download "$TAG" -R bongofongo/dreamd \
            -p "dreamd-$V-$A.tar.gz.sha256" -O linux.sha256
          SHA_LINUX="$(tr -d '[:space:]' < linux.sha256)"
          sed -e "s|@@VERSION@@|$V|" \
              -e "s|@@SHA_LINUX@@|$SHA_LINUX|" \
              packaging/PKGBUILD.tmpl > PKGBUILD
          # Token-shaped from the start, not a bare '@@': the template's own
          # header comment says "the two tokens below", sed never touches a
          # comment, and a bare match would fire on every single run — which is
          # exactly what the cask guard above did until v0.1.0.
          grep -n '@@[A-Z_]\+@@' PKGBUILD && { echo "unsubstituted token left in PKGBUILD" >&2; exit 1; }
          # A PKGBUILD is a bash script; a syntax error here is a package nobody
          # can build, and it costs nothing to catch before upload.
          bash -n PKGBUILD
          cat PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: PKGBUILD
          path: PKGBUILD
          if-no-files-found: error

  # Captures one perf-history data point per published release, for the public
  # chart at website/src/pages/perf.astro. perf/scripts/publish-history.sh does
  # the actual write; this job's only job is producing its two inputs — a
  # `deep`-tier perf/run.sh result and the real shipped AppImage — and
  # committing the result.
  #
  # Gated the same way as `tap`/`aur`: `github.event_name == 'release'` fires
  # only when a human PUBLISHES (not on the draft-creating `push` that runs
  # `build`/`release` above), so a discarded draft records nothing.
  # `!github.event.release.prerelease` matches those two jobs too.
  #
  # ubuntu-22.04, not `ubuntu-latest`: matches the `build` matrix's Linux entry
  # and every other perf-adjacent Linux job in this repo (ci.yml's `launch`,
  # canary.yml), so meta.machine in the result reads as a real, describable CI
  # environment rather than an image that silently rolls out from under it.
  #
  # This measures the CODE AT THE TAG: the checkout below carries no `ref:`, so
  # on a `release` event it lands on the tag's own commit — same as `verify`'s
  # push-triggered version check does for the same event's `push` sibling. The
  # AppImage measured for size is the literal release asset (`gh release
  # download`, the same pattern `tap`/`aur` already use for checksums) rather
  # than a fresh rebuild: less CI time, no tauri-cli/packaging/build.sh needed
  # here at all, and it is provably the bytes a user downloads rather than a
  # separately-built stand-in.
  #
  # A SECOND checkout of `main` (below, `path: main-branch`) is what the result
  # actually gets written into and committed from. `main` may have moved past
  # this tag by the time a human gets around to publishing — straight-to-main,
  # no branches — and publish-history.sh's idempotent-by-version merge has to
  # run against main's CURRENT website/src/data/perf-history.json, not a copy
  # frozen at tag time, or this push could clobber a later release's entry.
  #
  # No `needs:`, and `continue-on-error: true`: capturing perf data must never
  # block or fail the release itself, and nothing here is a dependency of `tap`
  # or `aur` — this is purely additive.
  #
  # `permissions: contents: write` is already set workflow-wide, at the top of
  # this file. This job needs no permissions block of its own to push to main.
  perf-history:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    continue-on-error: true
    # perf/README.md says `deep` is ~20min on the machine it was measured on.
    # This job also pays for four separate `cargo build`s inside that tier
    # (debug+perf and release+perf via startup.sh/loop.sh, profiling+perf and a
    # plain release build via profile.sh — see perf/run.sh and
    # perf/scripts/profile.sh) plus the full criterion bench sweep, on a free
    # 2-core runner rather than a development box. 75 minutes is a guess at
    # generous headroom, not a measurement — revisit after this has actually run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Same package list ci.yml's `rust`/`launch` jobs install, plus two this
      # job alone needs: `time` (GNU time — `/usr/bin/time -v` is what
      # startup.sh reads peak RSS from on Linux, and it is a separate package
      # from the shell builtin, not preinstalled) and `xvfb` (startup.sh and
      # loop.sh launch the real windowed binary directly, with no re-exec of
      # their own the way packaging/smoke.sh has — the display has to already
      # exist when they run).
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev patchelf file xvfb time

      # Pinned to match ci.yml/canary.yml, not this file's own `build` job's
      # `@stable` — this isn't part of the signed release matrix, and a
      # floating toolchain has no business changing what a perf number means
      # from one release to the next.
      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: perf-history

      # profile.sh treats cargo-bloat as optional — skipped with its install
      # line printed if absent — and it is not required for any of the three
      # metrics publish-history.sh reads. Installed anyway for a complete deep
      # profile; the cache above is what keeps a repeat of this cheap.
      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      # perf/run.sh itself needs node (corpus generation, the comparison step).
      # Pinned to match ci.yml's node jobs rather than trusting the runner
      # image's default.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The literal release asset, not a fresh build: provably the bytes this
      # release ships, and downloading it needs neither tauri-cli nor
      # packaging/build.sh's ~8-minute pipeline.
      - name: Download the shipped AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          gh release download "$TAG" -R bongofongo/dreamd \
            -p "dreamd-$V-x86_64-unknown-linux-gnu.AppImage" -O dreamd.AppImage

      # first_paint / save_to_paint / peak_rss all come from a binary this step
      # builds itself with --features perf (perf/run.sh, via startup.sh and
      # loop.sh) — necessarily a SEPARATE build from the plain release the
      # downloaded AppImage carries, since instrumentation never ships
      # (CLAUDE.md: perf is "off-by-default"). Two different builds of the same
      # commit is expected, not a bug.
      #
      # The whole tier runs under one xvfb-run rather than per-launch: the real
      # app is launched many times across the debug and release real-app
      # passes, and one Xvfb instance for the duration is what
      # packaging/smoke.sh's own re-exec achieves for a single launch.
      # WEBKIT_DISABLE_DMABUF_RENDERER=1 matches ci.yml's `launch` job's
      # "must stay green" arm — a hosted runner has no GPU, so the accelerated
      # path is not the one to trust here.
      - name: Run deep perf tier
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            perf/run.sh deep

      # A glob into an array, not `ls ... | head -1`: this repo's own
      # perf/scripts/startup.sh carries the same warning against piping into
      # `head` under `pipefail` (SIGPIPE kills the upstream command and takes
      # the whole script down with it, per perf/run.sh's `sort | head -1` note).
      # Exactly one file is expected — one tier, one run, one machine.
      - name: Locate the result file
        id: result
        run: |
          set -euo pipefail
          files=(perf/results/deep-*.json)
          f="${files[0]}"
          [[ -f "$f" ]] || { echo "no deep-tier result file produced" >&2; exit 1; }
          echo "path=$PWD/$f" >> "$GITHUB_OUTPUT"

      # Deliberately a second checkout rather than switching the first one:
      # publish-history.sh derives its own root from its own script path
      # (`$(dirname "${BASH_SOURCE[0]}")/../..`), so invoking THIS copy of it —
      # under main-branch/ — is what makes it read and write
      # main-branch/website/src/data/perf-history.json against main's current
      # tip, and compute VERSION from main-branch/src-tauri/Cargo.toml, which
      # should already carry the released version: the version bump lands on
      # main before the tag that names it.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      # The explicit third argument is a label, not the runner's real hostname
      # (an ephemeral, meaningless GitHub Actions runner name) — the same
      # reason publish-history.sh never reads .meta.machine.id for this file.
      - name: Record this release's numbers
        run: |
          set -euo pipefail
          main-branch/perf/scripts/publish-history.sh \
            "${{ steps.result.outputs.path }}" "$PWD/dreamd.AppImage" \
            "ubuntu-22.04 (CI)"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd main-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/data/perf-history.json
          git diff --staged --quiet && { echo "perf-history.json unchanged"; exit 0; }
          # [skip ci]: GitHub natively skips workflow runs for a push whose HEAD
          # commit carries this — ci.yml triggers on every push to main, and
          # this commit touches only inert JSON data no job here builds against.
          git commit -m "chore(perf): record $TAG performance history [skip ci]"
          git push origin main
