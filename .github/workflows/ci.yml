# Every push and every PR. The counterpart to release.yml, which only ever runs
# on a tag — before this file existed nothing checked main at all.
#
# `pull_request` is here even though commits go straight to main today. It costs
# nothing while unused, and it means an agent-authored branch is checked before
# it lands rather than after.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push while the first is still building makes the first irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both platforms, the same steps. macOS was the only entry until Linux became
  # a shipping target: `#[cfg(target_os = "macos")]` is now down to the
  # NsFileManager trash context and one arm of `menu::build`, and everything
  # else — including `adopt_root`, which carries the config reload, the re-walk,
  # the watcher re-arm and the marks swap — compiles on both. A Linux job is what
  # keeps that true; without it the untaken arm rots unseen, which is exactly
  # what happened to the *Linux* arm while this job was macOS-only.
  #
  # macos-14 matches the arm64 release runner; ubuntu-22.04 matches the Linux
  # one, and is the oldest supported image on purpose — glibc 2.35 is what keeps
  # the AppImage runnable on Arch and everything newer. Free on a public repo.
  #
  # fail-fast is off: one platform's failure should not hide the other's, which
  # is the whole reason for running both.
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk is the engine wry drives on Linux; gtk3 the toolkit both it
      # and the rfd File > Open picker need. librsvg and patchelf are the
      # bundler's, and they are installed here rather than only in release.yml so
      # that `cargo tauri build` is reachable from a CI debugging session without
      # a second dependency list to keep in sync.
      #
      # libxdo-dev is deliberately absent: `libxdo` appears nowhere in Cargo.lock,
      # so nothing here links it. It was installed on both runners until 2026-07-27
      # and removing it changed nothing — the README's Arch and Fedora lines had
      # always omitted it, and they were the correct ones.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev patchelf file

      # Pinned, unlike release.yml's `@stable`, and pinned to whatever the
      # development machine runs. `-D warnings` against a floating toolchain
      # turns main red whenever Rust ships a new lint, on a commit nobody made
      # — and a clippy that disagrees with the one you ran locally is worse than
      # no clippy. Bumping this is a deliberate commit that also clears whatever
      # the new toolchain found.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace root is the repo root, not src-tauri/.
          workspaces: ". -> target"
          # rust-cache already folds the runner into its key; naming the matrix
          # entry too makes it obvious in the log which arm restored what.
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets reaches the four benches and the four examples, so bench
      # rot and example rot fail here rather than the next time someone runs
      # `cargo bench` by hand. --all-features turns on `perf`, whose marks are
      # otherwise compiled out entirely.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # clippy is a check, not a link. CLAUDE.md's rule is that `cargo build`
      # passes before any commit touching src-tauri/, so assert exactly that.
      - name: Build
        run: cargo build

      # The example harnesses own what a unit test cannot reach, and each exits
      # non-zero on failure — but until now clippy only ever *compiled* them, so
      # a harness could go red for weeks without anyone running it. These two
      # need nothing but the crate: config_check points XDG_CONFIG_HOME at a
      # scratch directory before it touches anything, and theme_check reads the
      # bundled palettes. Seconds each, against a tree cargo has already built.
      # mcp_check joins them for the same reason and with the same guard: it
      # binds a real Unix socket under `config_dir()`, which is exactly what
      # `cargo test` is not allowed to touch, so the transport — the socket
      # mode, the bind-is-the-lock rule, the shim's wire format, a cancel that
      # really retires the thread — is only ever checked here. marks_check is
      # the same story one directory over: the marks file lives under
      # `config_dir()` too, and the modes, the size cap, the `.tmp` a crash
      # leaves behind and the rule deciding which of two dreamds may write at
      # all are only observable against a real one.
      #
      # These are the four that gain the most from the Linux arm: the socket,
      # the 0600/0700 modes and the atomic rename are the same *code* on both
      # platforms but a different kernel underneath, and until this matrix
      # existed none of it had ever run anywhere but macOS.
      - name: Correctness harnesses
        run: |
          cargo run --example config_check
          cargo run --example theme_check
          cargo run --example mcp_check
          cargo run --example marks_check

      # locate_check used to be excluded here as a perf tier's job. It isn't:
      # it is the only check with an independent oracle for highlight
      # anchoring, and anchoring now runs through `Store::add_anchored` rather
      # than through code inlined in main.rs. 611 corpus fixtures across every
      # document variant are what would catch that move — or any later change
      # to `markdown::locate` — breaking it.
      #
      # The cache key covers gen.mjs as well as the manifest: a changed
      # generator produces different fixtures for an unchanged manifest, and
      # keying on the manifest alone would serve the old ones. On a hit,
      # gen.mjs sees a matching manifest and exits without writing anything.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: perf/corpus/generated
          key: corpus-${{ hashFiles('perf/corpus/manifest.json', 'perf/corpus/gen.mjs') }}
      - name: Anchoring harness
        run: |
          node perf/corpus/gen.mjs
          cargo run --release --example locate_check

  # ubuntu, not macos-14: nothing the frontend is checked for is engine-specific,
  # and both of these run against a JS engine rather than against WKWebView.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: perf/harness/package-lock.json

      # No npm install, no Playwright: paths.test.mjs evaluates ui/paths.js in a
      # vm context and asserts on it directly. Seconds. Kept first so the cheap
      # check reports before the browser one starts downloading anything.
      - name: Path guards
        run: node --test ui/paths.test.mjs

      # The frontend's only correctness harness: it loads the real ui/ in
      # Chromium behind a stub of the Rust commands, drives the settings panel,
      # navigation, view mode and find, and asserts on the DOM.
      #
      # It had never run anywhere but its author's laptop, because it opened
      # `ui/` through an absolute path into one checkout — green by never being
      # executed. The path is derived now, and this step is what keeps it that
      # way. It asserts DOM structure, event wiring and which IPC calls the page
      # makes; no timings are taken and nothing here feeds perf/baseline.json.
      - name: Frontend harness
        working-directory: perf/harness
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node ui-check.mjs
